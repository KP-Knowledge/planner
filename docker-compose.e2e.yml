services:
  planner-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_DB: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5433:5432"
    volumes:
      - planner-e2e-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  planner-keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./e2e/keycloak:/opt/keycloak/data/import:ro

volumes:
  planner-e2e-pgdata:
